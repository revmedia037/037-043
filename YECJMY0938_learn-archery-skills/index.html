<!DOCTYPE html>
<html lang="zh">
<head>

<!-- Atlas lander tracking script — place at top of <head>. -->


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets//favicon.ico">
    <title>YE55</title>
    <style>
        body {
            background-color: black;
            margin: -50px 0px 0px 0px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /* Stack elements vertically */
            height: 100vh;
        }

        /* Ensure that the image scales well on mobile devices */
        img {
            max-width: 100%;
            height: auto;
            border: none;
            cursor: pointer;
        }

        /* Remove default button styles */
        button {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
        }

        /* Style for the additional button */
        .custom-button {
            margin-top: -10px;
            /* Adjust the spacing here */
            padding: 10px 20px;
            background-color: white;
            color: black;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid white;
            cursor: pointer;
            text-transform: uppercase;
        }

        .custom-button:hover {
            background-color: grey;
            color: white;
        }
    </style>
</head>

<!-- Button that uses JavaScript to redirect and track with Meta Pixel -->

        <button type="button">
            <span><br>
                <br></span>
